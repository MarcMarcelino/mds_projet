<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's Real? — Timer & Keywords</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Effet bord déchiré pour les bandes de mots-clés */
    .torn-strip {
      clip-path: polygon(
        0% 4%, 6% 0%, 14% 5%, 24% 1%, 36% 4%, 49% 0%, 62% 5%, 74% 1%, 86% 4%, 95% 0%, 100% 5%,
        99% 95%, 92% 100%, 81% 96%, 69% 100%, 56% 95%, 43% 100%, 30% 96%, 18% 100%, 7% 95%, 0% 99%
      );
    }
  </style>
</head>
<body class="min-h-screen bg-zinc-950 flex items-center justify-center p-2 sm:p-4 font-sans select-none">
  <!-- Cadre téléphone avec l'image de fond -->
  <main
    class="relative w-full max-w-[390px] min-h-[760px] rounded-[28px] border-[3px] border-white/90 shadow-2xl overflow-hidden flex flex-col justify-between px-6 py-6 bg-cover bg-center text-zinc-950"
    style="background-image: url('./assets/image%20(4).png');"
  >
    <!-- Barre discrète en haut pour changer de manche / lancer / reset -->
    <header class="relative z-10 flex items-center justify-between gap-2 bg-black/75 text-white px-3 py-1.5 rounded-full backdrop-blur-sm">
      <select
        id="roundSelect"
        aria-label="Select round"
        class="bg-transparent text-xs font-bold focus:outline-none cursor-pointer"
      ></select>
      <div class="flex items-center gap-1.5">
        <span id="difficultyBadge" class="text-[#d9ff3f] text-xs font-extrabold">★☆☆</span>
        <button
          id="startPauseBtn"
          type="button"
          class="bg-[#d9ff3f] text-black text-[11px] font-black uppercase px-2.5 py-0.5 rounded-full hover:brightness-95 cursor-pointer"
        >Start</button>
        <button
          id="resetBtn"
          type="button"
          class="text-zinc-300 hover:text-white text-[11px] font-bold px-1.5 py-0.5 cursor-pointer"
        >↺</button>
      </div>
    </header>

    <!-- Bloc TIMER + Anneau SVG -->
    <section class="relative z-10 flex flex-col items-center text-center mt-1">
      <h1 class="text-4xl font-black tracking-tight text-zinc-950 uppercase mb-3">
        TIMER
      </h1>

      <div class="relative w-48 h-48 flex items-center justify-center">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
          <!-- Cercle noir de fond -->
          <circle
            cx="60"
            cy="60"
            r="52"
            fill="none"
            stroke="#111111"
            stroke-width="8"
          />
          <!-- Progression jaune fluo -->
          <circle
            id="progressRing"
            cx="60"
            cy="60"
            r="52"
            fill="none"
            stroke="#d9ff3f"
            stroke-width="8"
            stroke-linecap="butt"
            stroke-dasharray="326.73"
            stroke-dashoffset="0"
            class="transition-all duration-300"
          />
        </svg>

        <div
          id="timerDisplay"
          class="absolute text-[42px] font-black tabular-nums tracking-tight text-zinc-950 transition-colors"
        >
          03:00
        </div>
      </div>
    </section>

    <!-- Bloc KEYWORDS + Bandes déchirées -->
    <section class="relative z-10 flex flex-col gap-2.5 my-2">
      <!-- Étiquette noire inclinée -->
      <div class="self-start bg-zinc-950 text-white px-3 py-1 -rotate-2 shadow-md">
        <span class="text-sm font-black italic tracking-wide uppercase">
          KEYWORDS <span id="keywordCounter" class="text-[#d9ff3f]">0/4</span>
        </span>
      </div>

      <!-- Liste verticale des bandes de mots-clés -->
      <div id="locksList" class="flex flex-col gap-2.5"></div>
    </section>

    <!-- Feedback + Barre de saisie style maquette -->
    <section class="relative z-10 flex flex-col gap-1.5 mt-1">
      <p id="feedbackMsg" class="min-h-[20px] text-xs font-extrabold px-1" aria-live="polite"></p>

      <form
        id="keywordForm"
        class="flex items-stretch border-[2.5px] border-zinc-950 bg-[#ece5d8] shadow-[4px_4px_0px_#111111]"
      >
        <input
          id="keywordInput"
          type="text"
          placeholder="Type a keyword..."
          autocomplete="off"
          required
          class="flex-1 bg-transparent px-3.5 py-3 text-sm font-bold text-zinc-950 placeholder-zinc-600 focus:outline-none"
        />
        <button
          type="submit"
          class="bg-zinc-950 text-[#d9ff3f] font-black italic text-base px-5 py-3 hover:bg-zinc-900 active:scale-95 transition cursor-pointer"
        >
          Submit
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
